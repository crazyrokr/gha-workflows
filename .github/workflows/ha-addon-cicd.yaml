name: Builder

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs"

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
      build: ${{ steps.filter.outputs.build }}
      test_apps: ${{ steps.filter.outputs.test_apps }}
      build_apps: ${{ steps.filter.outputs.build_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          apps=()
          read -ra apps <<< "${APPS}"

          build_apps=()
          for app in "${apps[@]}"; do
            for file in ${MONITORED_FILES}; do
              if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])${app}/${file} ]]; then
                build_apps+=("${app}")
                break
              fi
            done
          done

          test_apps=("${build_apps[@]}")
          if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])tests/ ]]; then
            test_apps=("${apps[@]}")
          fi

          # A pipeline change is validated end to end: test and rebuild all apps
          if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])\.github/workflows/ ]]; then
            test_apps=("${apps[@]}")
            build_apps=("${apps[@]}")
          fi

          for kind in test build; do
            case "${kind}" in
              test) selected=("${test_apps[@]}") ;;
              build) selected=("${build_apps[@]}") ;;
            esac
            if [[ ${#selected[@]} -gt 0 ]]; then
              echo "${kind}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${kind}=false" >> "$GITHUB_OUTPUT"
            fi
            echo "${kind}_apps=$(jq -nc '$ARGS.positional' --args "${selected[@]}")" >> "$GITHUB_OUTPUT"
          done

          echo "Apps to test: ${test_apps[*]:-none}"
          echo "Apps to build: ${build_apps[*]:-none}"

  test-app:
    name: Test ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.test == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.init.outputs.test_apps) }}
    uses: ./.github/workflows/ha-addon-test.yaml
    with:
      app: ${{ matrix.app }}

  build-app:
    name: Build ${{ matrix.app }}
    needs: [init, test-app]
    if: needs.init.outputs.build == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.build_apps) }}
    uses: ./.github/workflows/ha-addon-build.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

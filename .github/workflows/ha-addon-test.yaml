name: Test app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  test:
    name: Test ${{ inputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect tests
        id: detect
        env:
          APP: ${{ inputs.app }}
        run: |
          has_python=false
          if [ -d tests ] && find tests -name '*.py' -print -quit | grep -q .; then
            has_python=true
          fi
          echo "has_python=${has_python}" >> "$GITHUB_OUTPUT"

          js_files=""
          if [ -d tests ]; then
            js_files=$(find tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort | tr '\n' ' ')
          fi
          if [ -n "${js_files}" ]; then
            echo "has_js=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_js=false" >> "$GITHUB_OUTPUT"
          fi
          echo "js_files=${js_files}" >> "$GITHUB_OUTPUT"

          js_package=""
          has_test_script=false
          for candidate in "${APP}" .; do
            if [ -f "${candidate}/package.json" ]; then
              js_package="${candidate}"
              if [ -n "$(jq -r '.scripts.test // empty' "${candidate}/package.json")" ]; then
                has_test_script=true
              fi
              break
            fi
          done
          echo "js_package=${js_package}" >> "$GITHUB_OUTPUT"
          echo "has_test_script=${has_test_script}" >> "$GITHUB_OUTPUT"

          echo "Python tests: ${has_python}; JavaScript tests: ${js_files:-none}; package.json: ${js_package:-none}"

      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --disable-pip-version-check pytest
          if [ -f tests/requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r tests/requirements.txt
          fi

      - name: Run Python tests
        if: steps.detect.outputs.has_python == 'true'
        run: python -m pytest tests -v

      - name: Set up Node.js
        if: steps.detect.outputs.has_js == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        if: steps.detect.outputs.has_js == 'true' && steps.detect.outputs.js_package != ''
        working-directory: ${{ steps.detect.outputs.js_package }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run JavaScript tests with npm
        if: steps.detect.outputs.has_js == 'true' && steps.detect.outputs.has_test_script == 'true'
        working-directory: ${{ steps.detect.outputs.js_package }}
        run: npm test

      - name: Run JavaScript tests with Node
        if: steps.detect.outputs.has_js == 'true' && steps.detect.outputs.has_test_script != 'true'
        env:
          JS_FILES: ${{ steps.detect.outputs.js_files }}
        run: |
          read -ra files <<< "${JS_FILES}"
          node --test "${files[@]}"

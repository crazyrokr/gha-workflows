name: 'Auto-Lock Images'
description: 'Pins docker images to digests across build.yaml files'

inputs:
  branch:
    description: "Branch to analyze and lock"
    required: false
    default: ""
  lookup_sources:
    description: "Files containing candidates to lock"
    required: false
    default: "build.yaml Dockerfile"

runs:
  using: 'composite'
  steps:
    - name: Determine Branch
      id: branch-name
      shell: bash
      run: |
        # Check explicit input, fallback to head_ref (PRs), fallback to ref_name
        BRANCH="${{ inputs.branch }}"
        if [ -z "$BRANCH" ]; then
          BRANCH="${{ github.head_ref }}"
        fi
        if [ -z "$BRANCH" ]; then
          BRANCH="${{ github.ref_name }}"
        fi
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.branch-name.outputs.branch }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install Skopeo
      shell: bash
      run: |
        if ! command -v skopeo &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y skopeo
        else
          echo "Skopeo is already installed: $(skopeo --version)"
        fi

    - name: Run Locker Script
      id: locker
      shell: bash
      run: |
        LOCKED_FILES=$(python3 ${{ github.action_path }}/lock.py ${{ inputs.lookup_sources }} | tee /dev/stderr | tail -n 1)
        echo "locked_files=$LOCKED_FILES" >> $GITHUB_OUTPUT

    - name: Pull and Check for changes
      id: git-check
      shell: bash
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and Push changes
      if: steps.git-check.outputs.changed == 'true'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        branch: ${{ steps.branch-name.outputs.branch }}
        commit_message: "pin docker digests in build.yaml"
        file_pattern: "${{ steps.locker.outputs.locked_files }} docker-lock.json"